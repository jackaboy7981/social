repos:
  - repo: local
    hooks:
      - id: frontend-lint
        name: Frontend Lint
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        pass_filenames: false

      - id: frontend-format
        name: Frontend Format
        entry: bash -c 'cd frontend && npm run format'
        language: system
        pass_filenames: false