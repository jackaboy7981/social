services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
      - "5678:5678"
    volumes:
      - ./backend:/app
    command: >
      python -m debugpy
      --listen 0.0.0.0:5678
      -m uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

  frontend:
    build:
      context: ./frontend
    container_name: social-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
