services:
  db:
    image: postgres:16-alpine
    container_name: social-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: social
      POSTGRES_PASSWORD: social
      POSTGRES_DB: social
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social -d social"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
      - "5678:5678"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+psycopg://social:social@db:5432/social
    depends_on:
      db:
        condition: service_healthy
    command: >
      python -m debugpy
      --listen 0.0.0.0:5678
      -m uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

  frontend:
    build:
      context: ./frontend
    container_name: social-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
